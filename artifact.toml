kind = "web"
previewPath = "/"
title = "Shetkari Bazar"
version = "1.0.0"
id = "artifacts/shetkari-bazar"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20208

[services.development]
run = "pnpm --filter @workspace/shetkari-bazar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shetkari-bazar", "run", "build" ]
publicDir = "artifacts/shetkari-bazar/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20208"
BASE_PATH = "/"
